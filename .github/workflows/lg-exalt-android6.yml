name: LG Exalt Android 6 build

on:
  push:
    branches: [lg-exalt-android6-dpad]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'packages/**'
      - '.github/workflows/lg-exalt-android6.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest build for this branch; superseded builds should not
# accumulate in the hosted-runner queue.
concurrency:
  group: lg-exalt-android6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android6-armv7:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.8
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      # The app's path packages have their own test dependencies; resolve
      # them so flutter analyze can inspect those packages without false errors.
      - name: Resolve local package test dependencies
        run: |
          (cd packages/hebcal && dart pub get)
          (cd packages/siddur_engine && dart pub get)
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build compact Android 6 ARMv7 APK
        run: flutter build apk --release --flavor github --target-platform android-arm --build-name=0.14.0 --build-number=${{ github.run_number }}
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-github-release.apk amud-lg-exalt-android6-armv7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: amud-lg-exalt-android6-armv7
          path: amud-lg-exalt-android6-armv7.apk
          retention-days: 30
